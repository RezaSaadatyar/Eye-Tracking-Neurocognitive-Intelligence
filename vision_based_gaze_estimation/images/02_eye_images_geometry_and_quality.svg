<g id="context-module-1"><text x="358" y="115" class="context-heading">IMAGE INPUT</text><text x="358" y="151" class="context-body">36 × 60 grayscale crops</text><text x="358" y="177" class="context-body">7,500 selected images</text><text x="358" y="203" class="context-body">500 images per participant</text></g><g id="context-module-2"><text x="690" y="115" class="context-heading">TARGET SPACE</text><text x="690" y="151" class="context-body">3D gaze unit vectors</text><text x="690" y="177" class="context-body">Source normalised frame</text><text x="690" y="203" class="context-body">Physical axes require confirmation</text></g><g id="context-module-3"><text x="1020" y="115" class="context-heading">SOURCE ID</text><text x="1020" y="151" class="context-body">521 source MAT containers</text><text x="1020" y="177" class="context-body">213,658 decoded left-eye rows</text><text x="1020" y="203" class="context-body">7,500 unique sample keys</text></g><g id="context-module-4"><text x="1360" y="115" class="context-heading">ROLE SEPARATION</text><text x="1360" y="151" class="context-body">15 outer LOPO folds</text><text x="1360" y="177" class="context-body">12 Train / 2 Validation</text><text x="1360" y="203" class="context-body">1 held-out Test person</text></g></g><g id="band-2-analysis"><rect id="analysis-container" x="24" y="258" width="1652" height="314" rx="16" fill="#EDF6FB" stroke="#B4CFE0" stroke-width="1.5"/><g id="analysis-focus"><rect id="section-label-box" x="38" y="272" width="238" height="32" rx="9" fill="#173453"/><text x="157" y="293" class="section-label" text-anchor="middle">SCIENTIFIC FOCUS</text><rect id="focus-card" x="38" y="312" width="238" height="215" rx="10" fill="#F7FAFD" stroke="#DFEAF0" stroke-width="1.5"/><text x="54" y="344" class="focus-heading">ONE PERSON</text><text x="54" y="371" class="focus-heading">ONE ROLE</text><text x="54" y="409" class="focus-body">Keep all examples from</text><text x="54" y="437" class="focus-body">each person together.</text><text x="54" y="508" class="qualification">15 independent participants</text></g>
