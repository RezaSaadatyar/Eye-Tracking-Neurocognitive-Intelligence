" text-anchor="middle">7,500 unit-norm targets</text><text x="792" y="503" class="card-body" text-anchor="middle">Axes require source confirmation</text></g></g><g id="evidence-panel-3"><rect id="evidence-card-3" x="968" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/><path id="evidence-header-3" d="M979 272 H1281 Q1292 272 1292 283 V305 H968 V283 Q968 272 979 272 Z" fill="#174B70"/><text x="1130" y="294" class="card-heading" text-anchor="middle">PIXEL CONTRAST</text><g id="evidence-content-3"><g data-diagram="pixel-contrast" aria-label="Mean per-image pixel standard deviation by participant, computed from the sample index"><path d="M1002 415 H1274" stroke="#D9E6EF" stroke-width="1"/><text x="998" y="419" class="card-body" text-anchor="end">0</text><path d="M1002 375 H1274" stroke="#D9E6EF" stroke-width="1"/><text x="998" y="379" class="card-body" text-anchor="end">40</text><path d="M1002 335 H1274" stroke="#D9E6EF" stroke-width="1"/><text x="998" y="339" class="card-body" text-anchor="end">80</text><path d="M1002 330 V415 H1274" fill="none" stroke="#66879D" stroke-width="1.5"/><rect x="1008.0" y="341.13" width="12" height="73.87" fill="#236CDE"/><rect x="1025.3" y="340.68" width="12" height="74.32" fill="#236CDE"/><rect x="1042.6" y="340.83" width="12" height="74.17" fill="#236CDE"/><rect x="1059.9" y="341.40" width="12" height="73.60" fill="#236CDE"/><rect x="1077.2" y="339.73" width="12" height="75.27" fill="#236CDE"/><rect x="1094.5" y="340.70" width="12" height="74.30" fill="#236CDE"/><rect x="1111.8" y="341.77" width="12" height="73.23" fill="#236CDE"/><rect x="1129.1" y="341.32" width="12" height="73.68" fill="#236CDE"/><rect x="1146.4" y="340.74" width="12" height="74.26" fill="#236CDE"/><rect x="1163.7" y="340.85" width="12" height="74.15" fill="#236CDE"/><rect x="1181.0" y="341.80" width="12" height="73.20" fill="#236CDE"/><rect x="1198.3" y="341.99" width="12" height="73.01" fill="#236CDE"/><rect x="1215.6" y="