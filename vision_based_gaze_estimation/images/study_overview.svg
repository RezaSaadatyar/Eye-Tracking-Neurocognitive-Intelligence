<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc"><title id="title">VISION-BASED GAZE ESTIMATION | MPIIGaze</title><desc id="desc">Five-stage MPIIGaze source-to-evaluation workflow. The study-defined cohort contains 7500 normalised left-eye images from 15 participants, with four fixed procedures and 30000 matched outer LOPO predictions. Eye and role illustrations are schematic; numerical findings use saved outputs.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}.title{font-size:23px;font-weight:700;fill:#173453}.sub{font-size:15px;fill:#54738A}.source{font-size:11.5px;font-weight:700;fill:#53738A}.source-label{font-size:13px;fill:#173453}.context{font-size:15px;font-weight:700;fill:#173453}.context-body{font-size:13.5px;fill:#506C7E}.section{font-size:13.2px;font-weight:700;fill:#FFFFFF}.focus{font-size:16.5px;font-weight:700;fill:#173453}.focus-body{font-size:13.1px;fill:#506C7E}.qual{font-size:11.5px;font-weight:700;fill:#506C7E}.panel{font-size:13.5px;font-weight:700;fill:#FFFFFF}.body{font-size:12.1px;fill:#506C7E}.chart{font-size:11.8px;fill:#506C7E}.note{font-size:12.1px;font-weight:700;fill:#173453}.node-id{font-size:12.5px;font-weight:700;fill:#506C7E}.node-title{font-size:15px;font-weight:700;fill:#173453}.node-body{font-size:12.1px;fill:#506C7E}.terminal-id{font-size:12.5px;font-weight:700;fill:#DBF2EF}.terminal-title{font-size:15px;font-weight:700;fill:#FFFFFF}.terminal-body{font-size:12.1px;fill:#DBF2EF}.footer{font-size:13.3px;fill:#54738A}</style>
<rect x="0" y="0" width="1700" height="816" rx="20" fill="#F4F9FD" stroke="none" stroke-width="1.5"/>
