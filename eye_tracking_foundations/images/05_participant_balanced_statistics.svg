-anchor="middle">Saved stage files</text><text x="189.2" y="694" text-anchor="middle" font-family="DejaVu Sans" font-size="12.1" fill="#DBF2EF">External source / prior stage</text></g><g id="node-1"><rect x="368.4" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="519.5999999999999" y="636" class="nodeid" text-anchor="middle">01</text><text x="519.5999999999999" y="662" class="nodetitle" text-anchor="middle">Read stage 04</text><text x="519.5999999999999" y="694" class="nodedesc" text-anchor="middle">Named, auditable step</text></g><g id="node-2"><rect x="698.8" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="850.0" y="636" class="nodeid" text-anchor="middle">02</text><text x="850.0" y="662" class="nodetitle" text-anchor="middle">Aggregate by person</text><text x="850.0" y="694" class="nodedesc" text-anchor="middle">Named, auditable step</text></g><g id="node-3"><rect x="1029.1999999999998" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1180.3999999999999" y="636" class="nodeid" text-anchor="middle">03</text><text x="1180.3999999999999" y="662" class="nodetitle" text-anchor="middle">Estimate uncertainty</text><text x="1180.3999999999999" y="694" class="nodedesc" text-anchor="middle">Named, auditable step</text></g><g id="node-4"><rect x="1359.6" y="613" width="302.4" height="132" rx="15" fill="#176363" stroke="#176363" stroke-width="1.8"/><text x="1510.8" y="636" class="endnodeid" text-anchor="middle">OUTPUT</text><text x="1510.8" y="662" class="endnodetitle" text-anchor="middle">Current output tables</text><text x="1510.8" y="694" text-anchor="middle" font-family="DejaVu Sans" font-size="12.1" fill="#DBF2EF">Save summaries</text></g></g><g id="connectors"><path d="M346.4 679 L360.4 679" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)" fill="none"/><path d="M676.8 679 L690.8 