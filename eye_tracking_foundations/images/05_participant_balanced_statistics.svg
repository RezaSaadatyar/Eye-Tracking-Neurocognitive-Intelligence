erving</text><text x="54" y="470" class="focusbody" text-anchor="start">source provenance</text></g><g id="panels"><g id="panel-1"><rect x="292" y="272" width="324" height="254" rx="12" fill="white" stroke="#B6CFDE" stroke-width="1.5"/><rect x="292" y="272" width="324" height="33" rx="12" fill="#174B70" stroke="none" stroke-width="1"/><rect x="292" y="291" width="324" height="14" rx="0" fill="#174B70" stroke="none" stroke-width="1"/><text x="454.0" y="294" class="panelhead" text-anchor="middle">CHECK 01</text><text x="310" y="351" class="ctxhead" text-anchor="start">No row-wise independence</text><text x="310" y="390" class="panelbody" text-anchor="start">Participant/task groups</text><text x="310" y="417" class="panelbody" text-anchor="start">Records are not people</text><text x="310" y="444" class="panelbody" text-anchor="start">No repeated-row inflation</text></g><g id="panel-2"><rect x="630" y="272" width="324" height="254" rx="12" fill="white" stroke="#B6CFDE" stroke-width="1.5"/><rect x="630" y="272" width="324" height="33" rx="12" fill="#174B70" stroke="none" stroke-width="1"/><rect x="630" y="291" width="324" height="14" rx="0" fill="#174B70" stroke="none" stroke-width="1"/><text x="792.0" y="294" class="panelhead" text-anchor="middle">CHECK 02</text><text x="648" y="351" class="ctxhead" text-anchor="start">Task-specific summaries</text><text x="648" y="390" class="panelbody" text-anchor="start">Record-level inputs</text><text x="648" y="417" class="panelbody" text-anchor="start">Descriptive aggregates</text><text x="648" y="444" class="panelbody" text-anchor="start">No unseen-person claim</text></g><g id="panel-3"><rect x="968" y="272" width="324" height="254" rx="12" fill="white" stroke="#B6CFDE" stroke-width="1.5"/><rect x="968" y="272" width="324" height="33" rx="12" fill="#174B70" stroke="none" stroke-width="1"/><rect x="968" y="291" width="324" height="14" rx="0" fill="#174B70" stroke="none" stroke-width="1"/><text x="1130.0" y="294" class="panelhead" 