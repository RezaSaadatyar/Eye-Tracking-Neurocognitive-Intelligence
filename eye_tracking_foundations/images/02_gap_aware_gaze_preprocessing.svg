98B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="144" cy="164" r="21" fill="#7298B0" stroke="white" stroke-width="2"/><circle cx="144" cy="164" r="9" fill="#245E9D"/><path d="M218 144 L241 134" fill="none" stroke="#245E9D" stroke-width="1.5"/><text x="245" y="136" class="sourcebody" text-anchor="start">Gaze (x, y)</text><text x="245" y="159" class="sourcebody" text-anchor="start">Time n (ms)</text><text x="245" y="182" class="sourcebody" text-anchor="start">Validity val</text></g><g id="context-1"><text x="358" y="115" class="ctxhead" text-anchor="start">Upstream inputs</text><text x="358" y="148" class="ctxbody" text-anchor="start">01_gaze_samples.csv</text></g><g id="context-2"><text x="690" y="115" class="ctxhead" text-anchor="start">Eligibility</text><text x="690" y="148" class="ctxbody" text-anchor="start">val = 0, finite x/y</text></g><g id="context-3"><text x="1020" y="115" class="ctxhead" text-anchor="start">Run continuity</text><text x="1020" y="148" class="ctxbody" text-anchor="start">0 &lt; dt ≤ 5 ms</text></g><g id="context-4"><text x="1360" y="115" class="ctxhead" text-anchor="start">Motion output</text><text x="1360" y="148" class="ctxbody" text-anchor="start">Speed in dva/s</text></g></g><g id="band-2-analysis"><rect x="24" y="258" width="1652" height="314" rx="16" fill="#EDF6FB" stroke="#B4CFE0" stroke-width="1.5"/><rect x="38" y="272" width="238" height="32" rx="9" fill="#173453" stroke="#173453" stroke-width="1.5"/><text x="157" y="293" class="sectionlabel" text-anchor="middle">PROVISIONAL METHOD</text><g id="focus"><rect x="38" y="312" width="238" height="215" rx="10" fill="#F7FAFD" stroke="#DFEAF0" stroke-width="1.5"/><text x="54" y="344" class="focushead" text-anchor="start">Analysis focus</text><text x="54" y="389" class="focusbody" text-anchor="start">40 source recordings</text><text x="54" y="416" class="focusbody" text-anchor="start">One record per pass</text><text x="54" y="443" class="focusbody" text-anc