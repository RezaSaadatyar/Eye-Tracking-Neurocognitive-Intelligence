<text x="990" y="509" font-family="DejaVu Sans,Arial,sans-serif" font-size="11.8" fill="#506C7E">Raw / median: schematic only</text>
</g><g id="panel-4"><rect x="1306" y="272" width="356" height="254" rx="12" fill="white" stroke="#B6CFDE" stroke-width="1.5"/><rect x="1306" y="272" width="356" height="33" rx="12" fill="#174B70" stroke="none" stroke-width="1"/><rect x="1306" y="291" width="356" height="14" rx="0" fill="#174B70" stroke="none" stroke-width="1"/><text x="1484.0" y="294" class="panelhead" text-anchor="middle">ANGULAR SPEED</text><text x="1324" y="351" class="ctxhead" text-anchor="start">Adjacent smoothed positions</text><text x="1324" y="390" class="panelbody" text-anchor="start">Euclidean Δgaze / Δtime</text><text x="1324" y="417" class="panelbody" text-anchor="start">Units: dva/s</text><text x="1324" y="444" class="panelbody" text-anchor="start">Undefined at boundaries</text>
