</g></g><g id="scientific-note"><rect x="301" y="540" width="1361" height="25" rx="12" fill="#E0F2EC" stroke="#D3EAE2" stroke-width="1.5"/><circle cx="324" cy="552" r="9" fill="#23749A"/><text x="324" y="556" font-family="DejaVu Sans" font-size="12" font-weight="700" text-anchor="middle" fill="white">i</text><text x="342" y="556" class="panelbody" text-anchor="start">Method schematic (not stage-02 results): 5-sample centred median, 5-ms gap rule; original gaze remains intact</text></g></g><g id="band-3-workflow"><rect x="24" y="588" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/><g id="nodes"><g id="node-0"><rect x="38.0" y="613" width="302.4" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="189.2" y="636" class="endnodeid" text-anchor="middle">INPUT</text><text x="189.2" y="662" class="endnodetitle" text-anchor="middle">Stage 01 source table</text><text x="189.2" y="694" text-anchor="middle" font-family="DejaVu Sans" font-size="12.1" fill="#DBF2EF">01_gaze_samples.csv</text></g><g id="node-1"><rect x="368.4" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="519.5999999999999" y="636" class="nodeid" text-anchor="middle">01</text><text x="519.5999999999999" y="662" class="nodetitle" text-anchor="middle">Stream 40 records</text><text x="519.5999999999999" y="694" class="nodedesc" text-anchor="middle">No source re-download</text></g><g id="node-2"><rect x="698.8" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="850.0" y="636" class="nodeid" text-anchor="middle">02</text><text x="850.0" y="662" class="nodetitle" text-anchor="middle">Split valid runs</text><text x="850.0" y="694" class="nodedesc" text-anchor="middle">val = 0, dt ≤ 5 ms</text></g><g id="node-3"><rect x="1029.1999999999998" y="613" width="302.4" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1180.39999