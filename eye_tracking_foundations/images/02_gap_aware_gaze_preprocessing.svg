<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">GAP-AWARE GAZE PREPROCESSING</title><desc id="svg-desc">Five-band method schematic for Notebook 02; all preprocessing settings are provisional and no derived outcomes are plotted.</desc><defs><style>
