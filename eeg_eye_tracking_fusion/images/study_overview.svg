      <text id="text-026" x="54" y="416" class="focus-body" data-container="focus-card">beyond eye features?</text>
      <text id="text-027" x="54" y="443" class="focus-body" data-container="focus-card">Use matched windows</text>
      <text id="text-028" x="54" y="470" class="focus-body" data-container="focus-card">Avoid text/task confounds</text>
      <text id="text-029" x="54" y="508" class="qualification" data-container="focus-card">Fusion gain is a hypothesis</text>
    </g>
