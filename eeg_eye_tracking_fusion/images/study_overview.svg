      <text id="text-013" x="690" y="174" class="context-body" data-container="context-container">Task condition, not cognition</text>
      <text id="text-014" x="690" y="200" class="context-body" data-container="context-container">630 paired 12-s windows</text>
    </g>
    <g id="context-module-3">
      <text id="text-015" x="1020" y="115" class="context-heading" data-container="context-container">SCIENTIFIC CONTRAST</text>
      <text id="text-016" x="1020" y="148" class="context-body" data-container="context-container">Gaze-only versus EEG-only</text>
      <text id="text-017" x="1020" y="174" class="context-body" data-container="context-container">Simple versus gated fusion</text>
      <text id="text-018" x="1020" y="200" class="context-body" data-container="context-container">Same eligible samples</text>
    </g>
    <g id="context-module-4">
