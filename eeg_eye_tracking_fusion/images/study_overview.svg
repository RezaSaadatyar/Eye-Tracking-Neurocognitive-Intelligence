<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
  <title id="title">EEG–Eye-Tracking | Final Test Evaluated</title>
  <desc id="desc">The 18-person ZuCo 2.0 study has six executed stages: 36 NR/TSR source runs, 630 paired EEG/gaze windows, and participant-disjoint 11 Train, three Validation and four Test people. Ten fixed candidates gave 990 aligned Validation predictions. Gaze Random Forest was frozen using Validation (Macro F1 0.6244). Its independently held-out four-person Test evaluated 160 windows (Macro F1 0.4997, Accuracy and Balanced Accuracy 0.5250) without Test-based model re-selection. Results classify source reading-task labels, not comprehension; independent clock-drift and calibration accuracy remain unverified.</desc>
