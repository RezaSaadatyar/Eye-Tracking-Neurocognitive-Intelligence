      <text id="text-020" x="1360" y="148" class="context-body" data-container="context-container">Stages 01–06 complete</text>
      <text id="text-021" x="1360" y="174" class="context-body" data-container="context-container">Final Test scored</text>
      <text id="text-022" x="1360" y="200" class="context-body" data-container="context-container">Test F1 = 0.4997</text>
    </g>
  </g>
  <g id="band-2-analysis">
    <rect id="analysis-container" x="24" y="258" width="1652" height="314" rx="16" fill="#EDF6FB" stroke="#B4CFE0" stroke-width="1.5"/>
    <g id="analysis-focus">
