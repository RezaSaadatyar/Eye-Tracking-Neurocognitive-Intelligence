.source-label { font-size:13px; fill:#173453; }
.context-heading { font-size:15px; font-weight:700; fill:#173453; }
.context-body { font-size:13.5px; fill:#506C7E; }
.section-label { font-size:13.2px; font-weight:700; fill:#FFFFFF; }
.focus-heading { font-size:16.5px; font-weight:700; fill:#173453; }
.focus-body { font-size:13.1px; fill:#506C7E; }
.qualification { font-size:11.5px; font-weight:700; fill:#506C7E; }
.card-heading { font-size:13.5px; font-weight:700; fill:#FFFFFF; }
.card-body { font-size:12.1px; fill:#506C7E; }
.chart-label { font-size:11.8px; fill:#506C7E; }
.scientific-note { font-size:12.1px; font-weight:700; fill:#173453; }
.workflow-id { font-size:12.5px; font-weight:700; fill:#506C7E; }
.workflow-heading { font-size:15px; font-weight:700; fill:#173453; }
.workflow-body { font-size:12.1px; fill:#506C7E; }
.terminal-id { font-size:12.5px; font-weight:700; fill:#DBF2EF; }
.terminal-heading { font-size:15px; font-weight:700; fill:#FFFFFF; }
.terminal-body { font-size:12.1px; fill:#DBF2EF; }
.footer { font-size:13.3px; fill:#54738A; }
.info-mark { font-size:12px; font-weight:700; fill:#FFFFFF; }</style>
  </defs>
  <rect id="canvas" x="0" y="0" width="1700" height="816" rx="20" fill="#F4F9FD"/>
  <g id="band-0-header">
    <text id="text-001" x="30" y="38" class="figure-title" data-container="canvas">EEG–Eye-Tracking | Final Test Evaluated</text>
    <text id="text-002" x="30" y="67" class="subtitle" data-container="canvas">18 people | 630 paired windows | 10 models | Frozen selection + final Test</text>
  </g>
  <g id="band-1-context">
    <rect id="context-container" x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
    <g id="source-schematic" data-slot="replace-for-actual-data-source">
      <g id="paired-signal-icon"><rect x="44" y="123" width="92" height="94" rx="10" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><path d="M52 155 L62 155 L68 137 L75 177 L83 151 L90 151 L96 145 L103 160 L111 153 L128 153" fill="none" stroke="#174B70" stroke-width="2.2" stroke-linejoin="round"/><path d="M52 195 Q62 184 72 191 T93 190 T128 191" fill="none" stroke="#176363" stroke-width="2.6" stroke-linecap="round"/></g><text id="text-003" x="153" y="110" class="source-heading" data-container="context-container">Z U C O   2.0</text>
      <text id="text-004" x="153" y="157" class="source-label" data-container="context-container">128-channel EEG</text>
      <text id="text-005" x="153" y="182" class="source-label" data-container="context-container">EyeLink left eye</text>
      <text id="text-006" x="153" y="207" class="source-label" data-container="context-container">NR and TSR runs</text>
    </g>
    <g id="context-module-1">
      <text id="text-007" x="358" y="115" class="context-heading" data-container="context-container">SOURCE DATA</text>
      <text id="text-008" x="358" y="148" class="context-body" data-container="context-container">ZuCo 2.0, v1.0.0</text>
      <text id="text-009" x="358" y="174" class="context-body" data-container="context-container">EEG + EyeLink BIDS</text>
      <text id="text-010" x="358" y="200" class="context-body" data-container="context-container">18 participants / 36 runs</text>
    </g>
    <g id="context-module-2">
      <text id="text-011" x="690" y="115" class="context-heading" data-container="context-container">PREDICTION TARGET</text>
