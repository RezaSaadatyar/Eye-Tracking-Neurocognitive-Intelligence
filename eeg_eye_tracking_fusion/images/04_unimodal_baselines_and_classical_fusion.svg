<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
  <title id="title">04 | Classical EEG, Gaze and Fusion Models</title>
  <desc id="desc">Executed seven-candidate classical comparison of four EEG and four gaze window-mean features on 630 source-matched ZuCo 2.0 windows from 18 participants. Six estimators were fitted on 371 Train windows from 11 people and the fixed late-fusion candidate combines logistic probabilities with equal 0.5 and 0.5 weights. All candidates were evaluated on 99 Validation windows (60 NR, 39 TSR) from three other people. Gaze Random Forest led with Macro F1 0.6244, Balanced Accuracy 0.6231 and Accuracy 0.6465; late equal fusion yielded Macro F1 0.5643, early-fusion logistic 0.4518. Person-level gaze forest Macro F1 varied from 0.3478 to 0.7654. No evaluated classical multimodal candidate exceeded the strongest unimodal gaze model on this Validation partition, and no Test scores are claimed.</desc>
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/>
    </marker>
