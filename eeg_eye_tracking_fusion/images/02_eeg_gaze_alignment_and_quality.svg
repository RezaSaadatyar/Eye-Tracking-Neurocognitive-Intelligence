  <rect id="canvas" x="0" y="0" width="1700" height="816" rx="20" fill="#F4F9FD"/>
  <g id="band-0-header">
    <text id="text-001" x="30" y="38" class="figure-title" data-container="canvas">02 | EEG–Gaze Alignment and Paired-Window Quality</text>
    <text id="text-002" x="30" y="67" class="subtitle" data-container="canvas">BIDS StartTime and sampling rates define overlap; independent clock drift remains unverified</text>
  </g>
  <g id="band-1-context">
    <rect id="context-container" x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
    <g id="source-schematic" data-slot="replace-for-actual-data-source">
      <g id="paired-signal-icon"><rect x="44" y="123" width="92" height="94" rx="10" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><path d="M52 155 L62 155 L68 137 L75 177 L83 151 L90 151 L96 145 L103 160 L111 153 L128 153" fill="none" stroke="#174B70" stroke-width="2.2" stroke-linejoin="round"/><path d="M52 195 Q62 184 72 191 T93 190 T128 191" fill="none" stroke="#176363" stroke-width="2.6" stroke-linecap="round"/></g><text id="text-003" x="153" y="110" class="source-heading" data-container="context-container">Z U C O   2.0</text>
      <text id="text-004" x="153" y="157" class="source-label" data-container="context-container">128-channel EEG</text>
      <text id="text-005" x="153" y="182" class="source-label" data-container="context-container">EyeLink left eye</text>
      <text id="text-006" x="153" y="207" class="source-label" data-container="context-container">NR and TSR runs</text>
    </g>
    <g id="context-module-1">
      <text id="text-007" x="358" y="115" class="context-heading" data-container="context-container">PAIRED SOURCE</text>
      <text id="text-008" x="358" y="148" class="context-body" data-container="context-container">BrainVision continuous EEG</text>
      <text id="text-009" x="358" y="174" class="context-body" data-container="context-container">EyeLink physiology TSV</text>
      <text id="text-010" x="358" y="200" class="context-body" data-container="context-container">Event onset table</text>
    </g>
    <g id="context-module-2">
      <text id="text-011" x="690" y="115" class="context-heading" data-container="context-container">TIMEBASE</text>
      <text id="text-012" x="690" y="148" class="context-body" data-container="context-container">BIDS StartTime in sec</text>
      <text id="text-013" x="690" y="174" class="context-body" data-container="context-container">EEG/eye sample frequency</text>
      <text id="text-014" x="690" y="200" class="context-body" data-container="context-container">Shared overlap interval</text>
    </g>
    <g id="context-module-3">
      <text id="text-015" x="1020" y="115" class="context-heading" data-container="context-container">WINDOW POLICY</text>
      <text id="text-016" x="1020" y="148" class="context-body" data-container="context-container">12-s non-overlap</text>
      <text id="text-017" x="1020" y="174" class="context-body" data-container="context-container">Up to 20 per run</text>
      <text id="text-018" x="1020" y="200" class="context-body" data-container="context-container">Eye fraction at least 0.60</text>
    </g>
    <g id="context-module-4">
      <text id="text-019" x="1360" y="115" class="context-heading" data-container="context-container">SCIENTIFIC LIMIT</text>
      <text id="text-020" x="1360" y="148" class="context-body" data-container="context-container">Same nominal 500 Hz</text>
      <text id="text-021" x="1360" y="174" class="context-body" data-container="context-container">Does not prove drift-free</text>
      <text id="text-022" x="1360" y="200" class="context-body" data-container="context-container">Independent markers needed</text>
    </g>
  </g>
  <g id="band-2-analysis">
    <rect id="analysis-container" x="24" y="258" width="1652" height="314" rx="16" fill="#EDF6FB" stroke="#B4CFE0" stroke-width="1.5"/>
    <g id="analysis-focus">
      <rect id="section-label-box" x="38" y="272" width="238" height="32" rx="9" fill="#173453" stroke="#173453" stroke-width="1.5"/>
      <text id="text-023" x="157" y="293" class="section-label" text-anchor="middle" data-container="section-label-box">SCIENTIFIC DESIGN</text>
      <rect id="focus-card" x="38" y="312" width="238" height="215" rx="10" fill="#F7FAFD" stroke="#DFEAF0" stroke-width="1.5"/>
      <text id="text-024" x="54" y="344" class="focus-heading" data-container="focus-card">TEMPORAL QA</text>
      <text id="text-025" x="54" y="389" class="focus-body" data-container="focus-card">Are gaze and EEG</text>
      <text id="text-026" x="54" y="416" class="focus-body" data-container="focus-card">simultaneously valid?</text>
      <text id="text-027" x="54" y="443" class="focus-body" data-container="focus-card">Check event onsets</text>
      <text id="text-028" x="54" y="470" class="focus-body" data-container="focus-card">Exclude poor eye coverage</text>
      <text id="text-029" x="54" y="508" class="qualification" data-container="focus-card">Retain audit rows</text>
    </g>
    <g id="evidence-panel-1">
      <rect id="evidence-card-1" x="292" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-1" d="M303 272 H605 Q616 272 616 283 V305 H292 V283 Q292 272 303 272 Z" fill="#174B70"/>
      <text id="text-030" x="454.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-1">EEG TIMING</text>
      <g id="evidence-content-1" data-slot="scientific-content">
        <text id="text-031" x="454.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-1">Read recording length</text>
        <text id="text-032" x="454.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-1">500 Hz per sidecar</text>
        <text id="text-033" x="454.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-1">Validate finite duration</text>
      </g>
    </g>
    <g id="evidence-panel-2">
      <rect id="evidence-card-2" x="630" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-2" d="M641 272 H943 Q954 272 954 283 V305 H630 V283 Q630 272 641 272 Z" fill="#174B70"/>
      <text id="text-034" x="792.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-2">EYE TIMING</text>
      <g id="evidence-content-2" data-slot="scientific-content">
        <text id="text-035" x="792.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-2">StartTime + index / Hz</text>
        <text id="text-036" x="792.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-2">Missing x/y coordinates</text>
        <text id="text-037" x="792.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-2">Compute coverage</text>
      </g>
    </g>
    <g id="evidence-panel-3">
      <rect id="evidence-card-3" x="968" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-3" d="M979 272 H1281 Q1292 272 1292 283 V305 H968 V283 Q968 272 979 272 Z" fill="#174B70"/>
      <text id="text-038" x="1130.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-3">EVENT CROSSWALK</text>
      <g id="evidence-content-3" data-slot="scientific-content">
        <text id="text-039" x="1130.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-3">Fixations / saccades</text>
        <text id="text-040" x="1130.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-3">Triggers within recording</text>
        <text id="text-041" x="1130.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-3">No false synchrony claim</text>
      </g>
    </g>
    <g id="evidence-panel-4">
      <rect id="evidence-card-4" x="1306" y="272" width="356" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-4" d="M1317 272 H1651 Q1662 272 1662 283 V305 H1306 V283 Q1306 272 1317 272 Z" fill="#174B70"/>
      <text id="text-042" x="1484.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-4">WINDOW REGISTRY</text>
      <g id="evidence-content-4" data-slot="scientific-content">
        <text id="text-043" x="1484.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-4">Eligible paired windows</text>
        <text id="text-044" x="1484.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-4">Participant + task roles</text>
        <text id="text-045" x="1484.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-4">Exclude transparently</text>
      </g>
    </g>
    <g id="optional-scientific-note" data-optional="true">
      <rect id="note-strip" x="301" y="540" width="1064" height="25" rx="12" fill="#E0F2EC" stroke="#D3EAE2" stroke-width="1.5"/>
      <circle cx="324" cy="552" r="9" fill="#23749A"/>
      <text id="text-046" x="324" y="556" class="info-mark" text-anchor="middle">i</text>
      <text id="text-047" x="342" y="556" class="scientific-note" data-container="note-strip">Paired-signal eligibility precedes all model fitting.</text>
    </g>
  </g>
