      <path id="evidence-header-1" d="M303 272 H605 Q616 272 616 283 V305 H292 V283 Q292 272 303 272 Z" fill="#174B70"/>
      <text id="text-030" x="454.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-1">TEN-MODEL QA</text>
      <g id="evidence-content-1" data-slot="scientific-content">
        <text id="text-031" x="454.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-1">7 classical + 3 temporal</text>
        <text id="text-032" x="454.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-1">Recalculate metrics</text>
        <text id="text-033" x="454.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-1">Exact Validation identities</text>
      </g>
    </g>
    <g id="evidence-panel-2">
      <rect id="evidence-card-2" x="630" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-2" d="M641 272 H943 Q954 272 954 283 V305 H630 V283 Q630 272 641 272 Z" fill="#174B70"/>
      <text id="text-034" x="792.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-2">PRIMARY SELECTION</text>
      <g id="evidence-content-2" data-slot="scientific-content">
        <text id="text-035" x="792.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-2">Macro F1, then balance</text>
        <text id="text-036" x="792.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-2">Fixed-priority tie-break</text>
        <text id="text-037" x="792.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-2">Save decision before Test</text>
      </g>
    </g>
    <g id="evidence-panel-3">
      <rect id="evidence-card-3" x="968" y="272" width="324" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-3" d="M979 272 H1281 Q1292 272 1292 283 V305 H968 V283 Q968 272 979 272 Z" fill="#174B70"/>
      <text id="text-038" x="1130.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-3">RESERVED TEST</text>
      <g id="evidence-content-3" data-slot="scientific-content">
        <text id="text-039" x="1130.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-3">Disabled in this run</text>
        <text id="text-040" x="1130.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-3">80 windows / two people</text>
        <text id="text-041" x="1130.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-3">No Test outputs created</text>
      </g>
    </g>
    <g id="evidence-panel-4">
      <rect id="evidence-card-4" x="1306" y="272" width="356" height="254" rx="12" fill="#FFFFFF" stroke="#B6CFDE" stroke-width="1.5"/>
      <path id="evidence-header-4" d="M1317 272 H1651 Q1662 272 1662 283 V305 H1306 V283 Q1306 272 1317 272 Z" fill="#174B70"/>
      <text id="text-042" x="1484.0" y="294" class="card-heading" text-anchor="middle" data-container="evidence-card-4">VALIDATION MASKING</text>
      <g id="evidence-content-4" data-slot="scientific-content">
        <text id="text-043" x="1484.0" y="388" class="card-body" text-anchor="middle" data-container="evidence-card-4">Fixed early-fusion model</text>
        <text id="text-044" x="1484.0" y="416" class="card-body" text-anchor="middle" data-container="evidence-card-4">Mask one modality</text>
        <text id="text-045" x="1484.0" y="444" class="card-body" text-anchor="middle" data-container="evidence-card-4">No model retraining</text>
      </g>
    </g>
    <g id="optional-scientific-note" data-optional="true">
      <rect id="note-strip" x="301" y="540" width="1064" height="25" rx="12" fill="#E0F2EC" stroke="#D3EAE2" stroke-width="1.5"/>
      <circle cx="324" cy="552" r="9" fill="#23749A"/>
      <text id="text-046" x="324" y="556" class="info-mark" text-anchor="middle">i</text>
      <text id="text-047" x="342" y="556" class="scientific-note" data-container="note-strip">Recorded Stages 04/05: gaze logistic leads Validation (F1 0.8862); Stage 06 has not executed.</text>
    </g>
  </g>
