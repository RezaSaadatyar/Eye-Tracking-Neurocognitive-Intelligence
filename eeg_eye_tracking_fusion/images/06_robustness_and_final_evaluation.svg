  <rect id="canvas" x="0" y="0" width="1700" height="816" rx="20" fill="#F4F9FD"/>
  <g id="band-0-header">
    <text id="text-001" x="30" y="38" class="figure-title" data-container="canvas">06 | Validation Selection and Development QA</text>
    <text id="text-002" x="30" y="67" class="subtitle" data-container="canvas">Ten recorded Validation candidates | 31 windows from one person | Test scoring disabled</text>
  </g>
  <g id="band-1-context">
    <rect id="context-container" x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
    <g id="source-schematic" data-slot="replace-for-actual-data-source">
      <g id="paired-signal-icon"><rect x="44" y="123" width="92" height="94" rx="10" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><path d="M52 155 L62 155 L68 137 L75 177 L83 151 L90 151 L96 145 L103 160 L111 153 L128 153" fill="none" stroke="#174B70" stroke-width="2.2" stroke-linejoin="round"/><path d="M52 195 Q62 184 72 191 T93 190 T128 191" fill="none" stroke="#176363" stroke-width="2.6" stroke-linecap="round"/></g><text id="text-003" x="153" y="110" class="source-heading" data-container="context-container">Z U C O   2.0</text>
      <text id="text-004" x="153" y="157" class="source-label" data-container="context-container">128-channel EEG</text>
      <text id="text-005" x="153" y="182" class="source-label" data-container="context-container">EyeLink left eye</text>
      <text id="text-006" x="153" y="207" class="source-label" data-container="context-container">NR and TSR runs</text>
    </g>
    <g id="context-module-1">
      <text id="text-007" x="358" y="115" class="context-heading" data-container="context-container">RECONCILED INPUTS</text>
      <text id="text-008" x="358" y="148" class="context-body" data-container="context-container">7 classical models (04)</text>
      <text id="text-009" x="358" y="174" class="context-body" data-container="context-container">3 GRU models (05)</text>
      <text id="text-010" x="358" y="200" class="context-body" data-container="context-container">Same 31 Validation IDs</text>
    </g>
    <g id="context-module-2">
      <text id="text-011" x="690" y="115" class="context-heading" data-container="context-container">FROZEN SELECTION</text>
      <text id="text-012" x="690" y="148" class="context-body" data-container="context-container">Macro F1; balanced acc.</text>
      <text id="text-013" x="690" y="174" class="context-body" data-container="context-container">Fixed priority ties</text>
      <text id="text-014" x="690" y="200" class="context-body" data-container="context-container">Decision before any Test</text>
    </g>
    <g id="context-module-3">
      <text id="text-015" x="1020" y="115" class="context-heading" data-container="context-container">TEST POLICY</text>
      <text id="text-016" x="1020" y="148" class="context-body" data-container="context-container">Development: disabled</text>
      <text id="text-017" x="1020" y="174" class="context-body" data-container="context-container">80 windows reserved</text>
      <text id="text-018" x="1020" y="200" class="context-body" data-container="context-container">Separate approval required</text>
    </g>
    <g id="context-module-4">
      <text id="text-019" x="1360" y="115" class="context-heading" data-container="context-container">SENSITIVITY SCOPE</text>
      <text id="text-020" x="1360" y="148" class="context-body" data-container="context-container">Mask EEG or gaze</text>
      <text id="text-021" x="1360" y="174" class="context-body" data-container="context-container">Validation only; no refit</text>
      <text id="text-022" x="1360" y="200" class="context-body" data-container="context-container">Not causal attribution</text>
    </g>
  </g>
  <g id="band-2-analysis">
    <rect id="analysis-container" x="24" y="258" width="1652" height="314" rx="16" fill="#EDF6FB" stroke="#B4CFE0" stroke-width="1.5"/>
    <g id="analysis-focus">
      <rect id="section-label-box" x="38" y="272" width="238" height="32" rx="9" fill="#173453" stroke="#173453" stroke-width="1.5"/>
      <text id="text-023" x="157" y="293" class="section-label" text-anchor="middle" data-container="section-label-box">DEVELOPMENT REVIEW</text>
      <rect id="focus-card" x="38" y="312" width="238" height="215" rx="10" fill="#F7FAFD" stroke="#DFEAF0" stroke-width="1.5"/>
      <text id="text-024" x="54" y="344" class="focus-heading" data-container="focus-card">VALIDATION QUESTION</text>
      <text id="text-025" x="54" y="389" class="focus-body" data-container="focus-card">Which candidate leads</text>
      <text id="text-026" x="54" y="416" class="focus-body" data-container="focus-card">on one held-out person?</text>
      <text id="text-027" x="54" y="443" class="focus-body" data-container="focus-card">Ten fixed comparisons</text>
      <text id="text-028" x="54" y="470" class="focus-body" data-container="focus-card">No Test-based tuning</text>
      <text id="text-029" x="54" y="508" class="qualification" data-container="focus-card">Test remains reserved</text>
    </g>
    <g id="evidence-panel-1">
