<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
  <title id="title">06 | Recorded Validation Selection and Sensitivity</title>
  <desc id="desc">Stage 06 executed in development mode with Test scoring disabled. Ten predeclared candidates on 31 Validation windows from one participant were reconciled against 310 saved prediction rows. Gaze logistic regression was selected by fixed-label Validation Macro F1 0.8862 and Balanced Accuracy 0.8636. A fixed early-fusion logistic model yielded Validation Macro F1 0.5620 unchanged, 0.8862 when EEG features were masked via Train-fit imputation, and 0.4833 when gaze features were masked. These are descriptive sensitivity observations, not causal attribution or a generalised model ranking. The 80 Test windows from two participants remain unscored.</desc>
