    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/>
    </marker>
    <style>text { font-family: DejaVu Sans, Arial, sans-serif; font-weight: 400; }
