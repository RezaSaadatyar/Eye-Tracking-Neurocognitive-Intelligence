<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
  <title id="title">06 | Validation Selection and Development QA</title>
  <desc id="desc">Pre-execution Stage-06 five-band development workflow. Seven classical and three temporal candidates have recorded predictions on 31 Validation windows from a single ZuCo 2.0 participant. Recorded Stage-04/05 Validation leader: gaze logistic Macro F1 0.8862. The first Stage-06 run will verify the saved evidence, freeze the selected candidate and perform descriptive Validation feature masking. RUN_FINAL_TEST is False and all 80 Test windows remain unscored. No Stage-06 numerical result or Test claim is depicted.</desc>
