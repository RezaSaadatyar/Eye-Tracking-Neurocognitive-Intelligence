<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
  <title id="title">03 | EEG and Gaze Feature Engineering and Neurophysiology</title>
  <desc id="desc">Planned five-band scientific workflow for 03_preprocessing_features_and_neurophysiology. No measured model results or unverified alignment quality values are represented.</desc>
