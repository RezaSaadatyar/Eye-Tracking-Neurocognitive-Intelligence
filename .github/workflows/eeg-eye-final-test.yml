name: ZuCo EEG-Eye Final Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zuco-final-test-main
  cancel-in-progress: false

jobs:
  frozen-test-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
    steps:
      - name: Check out recorded study and fitted artefacts
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific evaluation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scipy>=1.11' 'scikit-learn==1.6.1' 'matplotlib>=3.7' 'joblib>=1.3' 'nbformat>=5.9' 'nbclient>=0.10' 'ipykernel>=6.28'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m ipykernel install --user --name python3
          python -m pip check

      - name: Execute Notebook 06 frozen Test branch and verify metrics
        run: python eeg_eye_tracking_fusion/code/src/run_final_test.py

      - name: Verify repository file-size policy
        run: python scripts/check_git_file_sizes.py --all

      - name: Retain computed Test evidence
        uses: actions/upload-artifact@v4
        with:
          name: zuco-18-person-heldout-test
          retention-days: 30
          path: |
            eeg_eye_tracking_fusion/output/06_test_metrics.csv
            eeg_eye_tracking_fusion/output/06_test_predictions.csv
            eeg_eye_tracking_fusion/output/06_person_metrics.csv
            eeg_eye_tracking_fusion/output/06_cluster_bootstrap.csv
            eeg_eye_tracking_fusion/output/06_primary_test_confusion.png
            eeg_eye_tracking_fusion/code/notebooks/06_robustness_and_final_evaluation.ipynb

      - name: Commit verified Test evidence to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            eeg_eye_tracking_fusion/code/notebooks/06_robustness_and_final_evaluation.ipynb \
            eeg_eye_tracking_fusion/output/06_model_selection.csv \
            eeg_eye_tracking_fusion/output/06_validation_person_metrics.csv \
            eeg_eye_tracking_fusion/output/06_validation_sensitivity.csv \
            eeg_eye_tracking_fusion/output/06_validation_evidence.png \
            eeg_eye_tracking_fusion/output/06_test_metrics.csv \
            eeg_eye_tracking_fusion/output/06_test_predictions.csv \
            eeg_eye_tracking_fusion/output/06_person_metrics.csv \
            eeg_eye_tracking_fusion/output/06_cluster_bootstrap.csv \
            eeg_eye_tracking_fusion/output/06_primary_test_confusion.png
          if git diff --cached --quiet; then
            echo 'Verification completed with no changes to recorded outputs'
            exit 0
          fi
          git commit -m 'Record frozen 18-person ZuCo held-out Test evaluation'
          git push origin HEAD:main
